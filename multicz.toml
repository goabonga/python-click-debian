# multicz config: single Python CLI shipped as a native Debian package.
#
# No `bump_files` is declared, so the `debian-changelog` writer claims
# the version-source role: multicz reads the upstream version from the
# topmost stanza of debian/changelog and prepends a new stanza on every
# bump. The top-level `changelog = "CHANGELOG.md"` adds a parallel
# keep-a-changelog markdown file for human readers.

[project]
commit_convention = "conventional"
tag_format        = "v{version}"
initial_version   = "0.0.0"

[components.helloworld]
paths     = ["src/**", "pyproject.toml", "debian/**", "tests/**"]
changelog = "CHANGELOG.md"

[[components.helloworld.writers]]
type            = "debian-changelog"
file            = "debian/changelog"
distribution    = "stable"
urgency         = "medium"
maintainer      = "Chris <goabonga@pm.me>"
debian_revision = 1
